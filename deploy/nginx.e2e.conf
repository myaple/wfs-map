# Local tests only. This deliberately impersonates Alice/Bob without mTLS.
# The configured identity header is overwritten, never accepted from callers.
map $cookie_wfs_test_user $test_user {
    "" alice;
    alice alice;
    bob bob;
    default "";
}
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 1040k;

    location ~ ^/__test/user/(alice|bob|none)$ {
        add_header Set-Cookie "wfs_test_user=$1; Path=/; SameSite=Lax" always;
        return 302 /;
    }
    location /api/test-wfs {
        proxy_pass http://fixture:8787;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-E2E-User $test_user;
        proxy_set_header X-User-Id "";
    }
    # A normal WFS service contacted by the browser, outside the Rust API.
    location = /wfs {
        proxy_pass http://fixture:8787;
        proxy_set_header Host $http_host;
    }
    location = /test-wfs {
        proxy_pass http://fixture:8787;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
