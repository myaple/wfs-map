name: Publish container

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Build and publish source container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out complete repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set source image tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}-src" >> "$GITHUB_OUTPUT"

      - name: Build source image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.source
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Verify complete source and Git history before publishing
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          source_directory=$(mktemp -d)
          container=$(docker create "$SOURCE_IMAGE" /unused)
          cleanup() {
            docker rm "$container" >/dev/null
            rm -rf "$source_directory"
          }
          trap cleanup EXIT
          docker cp "$container:/src/." "$source_directory/"
          diff -r "$GITHUB_WORKSPACE" "$source_directory"
          test "$(git -C "$source_directory" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$source_directory" rev-parse --is-shallow-repository)" = false
          git -C "$source_directory" fsck --full

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish source image on pushes
        if: github.event_name == 'push'
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$SOURCE_IMAGE"

  container:
    name: Build and publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-${GITHUB_SHA:0:7}"
            if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish pushes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preload database image for disconnected runtime test
        run: docker pull postgis/postgis:16-3.4

      - name: Test runtime on an internal network without Internet access
        run: bash scripts/test-container.sh "ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}"

      - name: Preload local E2E frontend and browser runner images
        run: |
          docker pull nginx:1.28-alpine
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble

      - name: Test real frontend, Rust API, identity gateway and PostGIS
        run: WFS_TEST_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}" bash scripts/test-e2e.sh
