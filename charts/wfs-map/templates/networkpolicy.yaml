{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wfs-map.fullname" . }}
  namespace: {{ include "wfs-map.namespace" . }}
  labels:
    {{- include "wfs-map.labels" . | fromYaml | mergeOverwrite (deepCopy .Values.networkPolicy.labels) | toYaml | nindent 4 }}
  {{- with mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.networkPolicy.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {{- include "wfs-map.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: {{- include "wfs-map.render" (dict "value" .Values.networkPolicy.ingress "context" $) | nindent 4 }}
  egress: {{- include "wfs-map.render" (dict "value" .Values.networkPolicy.egress "context" $) | nindent 4 }}
{{- end }}
